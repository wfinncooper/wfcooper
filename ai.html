<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finn Cooper</title>
    <style>
        body {
            background-color: #add8e6;
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 40px 20px;
            text-align: center;
        }

        h1 {
            color: #ff8200;
            font-size: 3.5rem;
            margin-bottom: 24px;
        }

        img {
            width: 200px;
            height: 300px;
            object-fit: cover;
            border-radius: 8px;
        }

        .about-label {
            font-size: 1.5rem;
            font-weight: bold;
            margin: 24px 0 8px;
        }

        .bio {
            max-width: 480px;
            margin: 0 auto;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <h1>Finn Cooper</h1>
    <img src="me.jpeg" alt="Portrait of Finn Cooper">
    <div class="about-label">About Me</div>
    <p class="bio">
        Welcome to my personal page!<br>
        I enjoy learning new things and meeting new people.<br>
        Thanks for stopping by.
    </p>
</body>
</html>
